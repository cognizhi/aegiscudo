name: Docker Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [mosquito-net, triage-counter, surgeon, aegiscudo-api, ai-analyst, emergency-room, command-center]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/Dockerfile.${{ matrix.service }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: aegiscudo/${{ matrix.service }}:${{ github.ref_name }},aegiscudo/${{ matrix.service }}:latest,aegiscudo/${{ matrix.service }}:sha-${{ github.sha }}
          build-args: APP_VERSION=${{ github.ref_name }}