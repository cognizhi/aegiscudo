[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "env-snoop"
version = "1.0.0"
description = "Aegiscudo malicious PyPI fixture — env exfiltration at install and import time"
requires-python = ">=3.8"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["env_snoop*"]
