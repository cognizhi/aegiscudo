components:
  parameters:
    ActorIdHeader:
      name: x-aegiscudo-actor-id
      in: header
      required: true
      description: Actor UUID for privileged tenant-scoped suppression administration routes.
      schema:
        type: string
        format: uuid
  schemas:
    AuthMode:
      type: string
      enum:
        - mock_oidc
        - oidc
        - saml
    AuthSubject:
      type: object
      additionalProperties: false
      required:
        - user_id
        - tenant_id
        - display_name
        - email
        - roles
      properties:
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
        mock_identity_id:
          type:
            - string
            - 'null'
    AuthSession:
      type: object
      additionalProperties: false
      required:
        - authenticated
        - auth_mode
        - mock_identity_supported
        - subject
      properties:
        authenticated:
          type: boolean
        auth_mode:
          $ref: '#/components/schemas/AuthMode'
        mock_identity_supported:
          type: boolean
        subject:
          oneOf:
            - $ref: '#/components/schemas/AuthSubject'
            - type: 'null'
    MockIdentityList:
      type: object
      additionalProperties: false
      required:
        - identities
      properties:
        identities:
          type: array
          items:
            $ref: '#/components/schemas/AuthSubject'
    SetMockAuthSessionRequest:
      type: object
      additionalProperties: false
      required:
        - identity_id
      properties:
        identity_id:
          type: string
    ErrorBody:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
        - checked_at
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
        version:
          type: string
        checked_at:
          type: string
          format: date-time
    PackageCoordinateSummary:
      type: object
      additionalProperties: false
      required:
        - ecosystem
        - name
      properties:
        ecosystem:
          type: string
          enum:
            - npm
            - pypi
            - cargo
            - maven
            - docker-oci
            - generic-http
            - githubactions
        name:
          type: string
        version:
          type: string
        namespace:
          type: string
    ArtifactDigest:
      type: object
      additionalProperties: false
      required:
        - algorithm
        - hex
      properties:
        algorithm:
          type: string
          enum:
            - sha256
        hex:
          type: string
          pattern: '^[a-f0-9]{64}$'
    PackageRequestKind:
      type: string
      enum:
        - metadata
        - artifact
    PolicyDecision:
      type: string
      enum:
        - ALLOW
        - ALLOW_WITH_WARNING
        - QUARANTINE_PENDING_ANALYSIS
        - BLOCK_KNOWN_MALICIOUS
        - BLOCK_POLICY_VIOLATION
        - REQUIRE_HITL_APPROVAL
        - FALLBACK_TO_APPROVED_CANDIDATE
    PolicyMode:
      type: string
      enum:
        - shadow
        - warn
        - enforce
    FeedState:
      type: string
      enum:
        - fresh
        - stale
        - degraded
        - unavailable
    NormalizedPackageRequest:
      type: object
      additionalProperties: false
      required:
        - kind
        - tenant_id
        - registry_config_id
        - policy_profile_id
        - coordinate
        - trace_id
        - explicit_version_or_integrity
      properties:
        kind:
          $ref: '#/components/schemas/PackageRequestKind'
        tenant_id:
          type: string
          format: uuid
        registry_config_id:
          type: string
          format: uuid
        policy_profile_id:
          type: string
          format: uuid
        coordinate:
          $ref: '#/components/schemas/PackageCoordinateSummary'
        trace_id:
          type: string
        requested_digest:
          $ref: '#/components/schemas/ArtifactDigest'
        source_url:
          type: string
        explicit_version_or_integrity:
          type: boolean
    DecisionRequest:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - registry_config_id
        - policy_profile_id
        - request
      properties:
        tenant_id:
          type: string
          format: uuid
        registry_config_id:
          type: string
          format: uuid
        policy_profile_id:
          type: string
          format: uuid
        request:
          $ref: '#/components/schemas/NormalizedPackageRequest'
    DecisionResponse:
      type: object
      additionalProperties: false
      required:
        - decision
        - tenant_id
        - policy_profile_id
        - policy_snapshot_id
        - mode
        - feed_state
        - feed_snapshot_age_seconds
        - trace_id
        - rationale
        - create_analysis_job
      properties:
        decision:
          $ref: '#/components/schemas/PolicyDecision'
        tenant_id:
          type: string
          format: uuid
        policy_profile_id:
          type: string
          format: uuid
        policy_snapshot_id:
          type: string
          format: uuid
        mode:
          $ref: '#/components/schemas/PolicyMode'
        feed_state:
          $ref: '#/components/schemas/FeedState'
        feed_snapshot_age_seconds:
          type: integer
        trace_id:
          type: string
        rationale:
          type: array
          items:
            type: string
        fallback_coordinate:
          $ref: '#/components/schemas/PackageCoordinateSummary'
        create_analysis_job:
          type: boolean
    CliScanPackageRequest:
      type: object
      additionalProperties: false
      required:
        - coordinate
      properties:
        coordinate:
          $ref: '#/components/schemas/PackageCoordinateSummary'
        artifact_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    CliScanRequest:
      type: object
      additionalProperties: false
      required:
        - packages
      properties:
        tenant_id:
          type: string
          format: uuid
        packages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CliScanPackageRequest'
    CliGithubActionsEnrichmentPackageRequest:
      type: object
      additionalProperties: false
      required:
        - coordinate
      properties:
        coordinate:
          $ref: '#/components/schemas/PackageCoordinateSummary'
    CliGithubActionsEnrichmentRequest:
      type: object
      additionalProperties: false
      required:
        - packages
      properties:
        tenant_id:
          type: string
          format: uuid
        policy_profile_id:
          type: string
          format: uuid
        packages:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CliGithubActionsEnrichmentPackageRequest'
    CliScanFindingResponse:
      type: object
      additionalProperties: false
      required:
        - coordinate
        - decision
        - trace_id
        - rationale
        - create_analysis_job
      properties:
        coordinate:
          $ref: '#/components/schemas/PackageCoordinateSummary'
        artifact_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        decision:
          $ref: '#/components/schemas/PolicyDecision'
        decision_timestamp:
          type: string
          format: date-time
          description: RFC 3339 timestamp when Aegiscudo evaluated this package decision for the CLI scan request.
        trace_id:
          type: string
        rationale:
          type: array
          items:
            type: string
        fallback_coordinate:
          $ref: '#/components/schemas/PackageCoordinateSummary'
        create_analysis_job:
          type: boolean
    CliScanResponse:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - registry_config_id
        - policy_profile_id
        - findings
      properties:
        tenant_id:
          type: string
          format: uuid
        registry_config_id:
          type: string
          format: uuid
        policy_profile_id:
          type: string
          format: uuid
        findings:
          type: array
          items:
            $ref: '#/components/schemas/CliScanFindingResponse'
    CliGithubActionsEnrichmentResponse:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - policy_profile_id
        - findings
      properties:
        tenant_id:
          type: string
          format: uuid
        policy_profile_id:
          type: string
          format: uuid
        findings:
          type: array
          items:
            $ref: '#/components/schemas/CliScanFindingResponse'
    CliRiskRequest:
      type: object
      additionalProperties: false
      required:
        - coordinate
      properties:
        tenant_id:
          type: string
          format: uuid
        coordinate:
          $ref: '#/components/schemas/PackageCoordinateSummary'
    CliRiskResponse:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - registry_config_id
        - policy_profile_id
        - coordinate
        - decision
        - rationale
        - trace_id
        - create_analysis_job
      properties:
        tenant_id:
          type: string
          format: uuid
        registry_config_id:
          type: string
          format: uuid
        policy_profile_id:
          type: string
          format: uuid
        coordinate:
          $ref: '#/components/schemas/PackageCoordinateSummary'
        decision:
          $ref: '#/components/schemas/PolicyDecision'
        rationale:
          type: array
          items:
            type: string
        trace_id:
          type: string
        create_analysis_job:
          type: boolean
    CliExplainRequest:
      type: object
      additionalProperties: false
      required:
        - coordinate
      properties:
        tenant_id:
          type: string
          format: uuid
        coordinate:
          $ref: '#/components/schemas/PackageCoordinateSummary'
    CliExplainResponse:
      type: object
      additionalProperties: false
      required:
        - tenant_id
        - analysis_job_id
        - artifact_id
        - trace_id
        - coordinate
        - artifact_sha256
        - recommended_action
        - confidence
        - summary
        - created_at
      properties:
        tenant_id:
          type: string
          format: uuid
        analysis_job_id:
          type: string
          format: uuid
        artifact_id:
          type: string
          format: uuid
        trace_id:
          type: string
        coordinate:
          $ref: '#/components/schemas/PackageCoordinateSummary'
        artifact_sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        recommended_action:
          $ref: '#/components/schemas/PolicyDecision'
        confidence:
          type: string
        summary:
          type: object
          additionalProperties: true
        ai_explanation:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
    EvidenceCounts:
      type: object
      additionalProperties: false
      required:
        - static_reports
        - sandbox_runs
        - ai_explanations
        - audit_events
      properties:
        static_reports:
          type: integer
        sandbox_runs:
          type: integer
        ai_explanations:
          type: integer
        audit_events:
          type: integer
    DashboardFeedFreshness:
      type: string
      enum:
        - fresh
        - stale
        - missing
    DashboardMetrics:
      type: object
      additionalProperties: false
      required:
        - blocked_packages
        - quarantine_queue_depth
        - active_overrides
        - feed_freshness
      properties:
        blocked_packages:
          type: integer
          format: int64
        quarantine_queue_depth:
          type: integer
          format: int64
        active_overrides:
          type: integer
          format: int64
        feed_freshness:
          $ref: '#/components/schemas/DashboardFeedFreshness'
        feed_snapshot_age_seconds:
          type: integer
          format: int64
          nullable: true
    RequestTimelineBucket:
      type: object
      additionalProperties: false
      required:
        - bucket_start
        - allow
        - warn
        - quarantine
        - block
      properties:
        bucket_start:
          type: string
          format: date-time
        allow:
          type: integer
        warn:
          type: integer
        quarantine:
          type: integer
        block:
          type: integer
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - actor
        - actor_display
        - actor_roles
        - action
        - resource
        - trace_id
        - occurred_at
        - metadata
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        actor:
          type: string
        actor_display:
          type: string
        actor_roles:
          type: array
          items:
            type: string
        action:
          type: string
        resource:
          type: string
        trace_id:
          type: string
        occurred_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    OpenVexExpiryMode:
      type: string
      enum:
        - never
        - expires-at
    OpenVexExpiryPolicy:
      type: object
      additionalProperties: false
      required:
        - mode
      properties:
        mode:
          $ref: '#/components/schemas/OpenVexExpiryMode'
        expires_at:
          type: string
          format: date-time
    OpenVexDocumentImportRequest:
      type: object
      additionalProperties: false
      required:
        - source
        - document
      properties:
        source:
          type: string
        document:
          description: OpenVEX v0.2.0 JSON document.
          type: object
          additionalProperties: true
        expiry_policy:
          $ref: '#/components/schemas/OpenVexExpiryPolicy'
    OpenVexDocumentSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - source
        - document_id
        - author
        - context
        - version
        - document_timestamp
        - imported_at
        - expiry_policy
        - document_digest
        - statement_count
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        source:
          type: string
        document_id:
          type: string
        author:
          type: string
        context:
          type: string
        version:
          type: integer
        document_timestamp:
          type: string
          format: date-time
        imported_at:
          type: string
          format: date-time
        expiry_policy:
          $ref: '#/components/schemas/OpenVexExpiryPolicy'
        document_digest:
          type: string
        statement_count:
          type: integer
    OpenVexDocument:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - source
        - document_id
        - author
        - context
        - version
        - document_timestamp
        - imported_at
        - expiry_policy
        - document_digest
        - statement_count
        - document
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        source:
          type: string
        document_id:
          type: string
        author:
          type: string
        context:
          type: string
        version:
          type: integer
        document_timestamp:
          type: string
          format: date-time
        imported_at:
          type: string
          format: date-time
        expiry_policy:
          $ref: '#/components/schemas/OpenVexExpiryPolicy'
        document_digest:
          type: string
        statement_count:
          type: integer
        document:
          type: object
          additionalProperties: true
    OverrideQueueItem:
      type: object
      additionalProperties: false
      required:
        - id
        - scope
        - reason
        - status
        - expires_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        scope:
          type: object
          additionalProperties: true
        reason:
          type: string
        requested_by:
          type: string
          format: uuid
        requested_by_display:
          type: string
        approved_by:
          type: string
          format: uuid
        approved_by_display:
          type: string
        status:
          type: string
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    OverrideActionRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
        actor_id:
          type: string
          format: uuid
    OverrideResponse:
      type: object
      additionalProperties: false
      required:
        - id
        - tenant_id
        - scope
        - reason
        - status
        - expires_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        scope:
          type: object
          additionalProperties: true
