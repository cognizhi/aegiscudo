openapi: 3.1.0
info:
  title: Aegiscudo API
  version: 0.1.0
  summary: Initial public and internal API contract skeleton for Command Center and aedo-cli.
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service health response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /v1/auth/session:
    get:
      operationId: getAuthSession
      responses:
        "200":
          description: Current API auth session state for local mock auth or future enterprise identity modes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
    delete:
      operationId: clearAuthSession
      responses:
        "204":
          description: Local auth session cleared or no-op for stateless clients.
  /v1/auth/session/mock:
    put:
      operationId: setMockAuthSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetMockAuthSessionRequest'
      responses:
        "200":
          description: Selected local mock identity for the returned session payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        "404":
          description: Requested mock identity was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "409":
          description: Mock identities are unavailable for the configured auth mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/auth/mock-identities:
    get:
      operationId: listMockAuthIdentities
      responses:
        "200":
          description: Available seeded local mock identities for local alpha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MockIdentityList'
        "409":
          description: Mock identities are unavailable for the configured auth mode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/analysis/request-timeline:
    get:
      operationId: listRequestTimeline
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant-scoped hourly decision buckets for the latest eight hours of persisted activity.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestTimelineBucket'
        "404":
          description: Tenant was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/analysis/dashboard-metrics:
    get:
      operationId: getDashboardMetrics
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant-scoped KPI summary cards for the executive dashboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMetrics'
        "404":
          description: Tenant was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/policy-profiles:
    get:
      operationId: listPolicyProfiles
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant-scoped policy profiles with latest version metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PolicyProfileSummary'
        "404":
          description: Tenant was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/policy-profiles/{policy_profile_id}/scorecard-thresholds:
    get:
      operationId: getPolicyScorecardThresholds
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: policy_profile_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Scorecard check thresholds and actions for the latest policy version of the specified profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyScorecardThresholds'
        "404":
          description: Tenant or policy profile was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/policy-simulator/replay:
    post:
      operationId: simulatePolicyReplay
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicySimulationRequest'
      responses:
        "200":
          description: Dry-run replay of historical requests against a target policy profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicySimulationResult'
        "400":
          description: Policy simulation request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "404":
          description: Tenant or policy profile was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "503":
          description: Triage Counter is unavailable for replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/analysis/quarantine-queue:
    get:
      operationId: listQuarantineQueue
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant-scoped quarantine or suspicious analysis queue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuarantineQueueItem'
        "404":
          description: Tenant was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/artifacts/{artifact_id}/evidence:
    get:
      operationId: getArtifactEvidence
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Aggregated evidence for the latest tenant-scoped analysis of an artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactEvidence'
        "404":
          description: Artifact evidence was not found for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/artifacts/{artifact_id}/static-analysis-reports:
    get:
      operationId: listArtifactStaticAnalysisReports
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Latest tenant-scoped static analysis report payloads for an artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactStaticAnalysisReports'
        "404":
          description: Artifact reports were not found for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/artifacts/{artifact_id}/sandbox-execution-reports:
    get:
      operationId: listArtifactSandboxExecutionReports
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Latest tenant-scoped sandbox telemetry payloads for an artifact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactSandboxExecutionReports'
        "404":
          description: Artifact reports were not found for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/overrides:
    get:
      operationId: listOverrides
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant-scoped override queue items for pending and resolved review.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OverrideQueueItem'
        "404":
          description: Tenant was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/overrides/{override_id}/approve:
    post:
      operationId: approveOverride
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: override_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideActionRequest'
      responses:
        "200":
          description: Override request approved for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverrideResponse'
        "400":
          description: Override action request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "401":
          description: Actor identity is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "403":
          description: Actor is not permitted to manage overrides for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "404":
          description: Override request was not found or is no longer pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/overrides/{override_id}/deny:
    post:
      operationId: denyOverride
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: override_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideActionRequest'
      responses:
        "200":
          description: Override request denied for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverrideResponse'
        "400":
          description: Override action request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "401":
          description: Actor identity is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "403":
          description: Actor is not permitted to manage overrides for the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "404":
          description: Override request was not found or is no longer pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/decisions/evaluate:
    post:
      operationId: evaluateDecision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        "200":
          description: Deterministic policy decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionResponse'
        "400":
          description: Decision request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "404":
          description: Policy profile, snapshot, or registry context was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "503":
          description: Triage Counter is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/registry-configs:
    get:
      operationId: listRegistryConfigs
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant-scoped registry configuration list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistryConfig'
        "404":
          description: Tenant was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      operationId: createRegistryConfig
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRegistryConfigRequest'
      responses:
        "201":
          description: Registry configuration created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryConfig'
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "404":
          description: Tenant or policy profile was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/registry-configs/{registry_config_id}:
    get:
      operationId: getRegistryConfig
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: registry_config_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Single registry configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryConfig'
        "404":
          description: Registry configuration not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    patch:
      operationId: updateRegistryConfig
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: registry_config_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRegistryConfigRequest'
      responses:
        "200":
          description: Registry configuration updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryConfig'
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "404":
          description: Registry configuration not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    delete:
      operationId: deleteRegistryConfig
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: registry_config_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Registry configuration soft-deleted.
        "404":
          description: Registry configuration not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/credentials:
    get:
      operationId: listCredentials
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tenant-scoped integration credential metadata list (values never returned).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CredentialStatus'
        "404":
          description: Tenant was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      operationId: createCredential
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCredentialRequest'
      responses:
        "201":
          description: Credential created (value never echoed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialStatus'
        "400":
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/credentials/{credential_id}:
    patch:
      operationId: rotateCredential
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotateCredentialRequest'
      responses:
        "200":
          description: Credential rotated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialStatus'
        "404":
          description: Credential not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    delete:
      operationId: deleteCredential
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Credential deleted.
        "404":
          description: Credential not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/credentials/{credential_id}/test-connection:
    post:
      operationId: testCredentialConnection
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: credential_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Connection test result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionTestResult'
        "404":
          description: Credential not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: actor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Tenant-scoped append-only audit event page.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        "404":
          description: Tenant was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/audit-events/export.csv:
    get:
      operationId: exportAuditEventsCsv
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: actor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Tenant-scoped audit event export in CSV format.
          content:
            text/csv:
              schema:
                type: string
        "404":
          description: Tenant was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/sboms:
    get:
      operationId: listTenantSboms
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - $ref: '#/components/parameters/ActorIdHeader'
      responses:
        "200":
          description: Tenant-scoped SBOM document summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SbomDocumentSummary'
        "400":
          description: The SBOM list query parameters were invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "401":
          description: Request actor header is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "403":
          description: Request actor is not authorized to read tenant SBOM data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "503":
          description: SBOM service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/sboms/{sbom_id}:
    get:
      operationId: downloadTenantSbom
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: sbom_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/ActorIdHeader'
      responses:
        "200":
          description: Tenant-scoped SBOM document download.
          headers:
            Content-Disposition:
              description: Attachment filename for the exported SBOM document.
              schema:
                type: string
            Content-Type:
              description: Media type for the exported SBOM document.
              schema:
                type: string
            Content-Length:
              description: Byte length of the exported SBOM document when available.
              schema:
                type: integer
                minimum: 0
            Cache-Control:
              description: Cache policy forwarded from the control-plane download path when present.
              schema:
                type: string
            ETag:
              description: Entity tag for the exported SBOM document when available.
              schema:
                type: string
            Content-Encoding:
              description: Content encoding for the exported SBOM document when present.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
                format: binary
        "401":
          description: Request actor header is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "403":
          description: Request actor is not authorized to read tenant SBOM data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "404":
          description: SBOM document was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        "503":
          description: SBOM service is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/tenants/{tenant_id}/openvex-documents:
    get:
      operationId: listOpenVexDocuments
      parameters:
        - name: tenant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/ActorIdHeader'
      responses:
        "200":
          description: Tenant-scoped imported OpenVEX document metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpenVexDocumentSummary'
        "401":
          description: Request actor header is missing.
          content:
            application/json:
              schema:
